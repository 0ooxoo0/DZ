# Конфигурация для тестов: та же схема БД, но in-memory и с наполнением.
# Файл перекрывает src/main/resources/application.properties в тестовом classpath.
spring.datasource.url=jdbc:h2:mem:transaction;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.read-only=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
